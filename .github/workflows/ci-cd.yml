name: CI/CD

# Pipeline completo: CI (lint, testes, segurança, IaC, build) + CD (publicação no ECR,
# deploy na EC2 com aprovação manual, smoke test e DAST).
# As etapas de CD só rodam quando a variável de repositório DEPLOY_ENABLED = "true".

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  LOCAL_IMAGE: devops-na-pratica:local

jobs:
  # ------------------------------------------------------------------ CI
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes automatizados com cobertura mínima de 80%
        run: >
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80 --junitxml=test-report.xml
      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-py${{ matrix.python-version }}
          path: |
            test-report.xml
            coverage.xml

  security:
    name: Segurança do código (SAST + dependências)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: SAST com Bandit
        run: bandit -r app -ll
      - name: Vulnerabilidades em dependências (pip-audit)
        run: pip-audit -r requirements.txt --strict

  iac:
    name: Terraform (fmt, validate, Checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Análise de segurança da IaC (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true

  build:
    name: Build, scan e testes dos containers
    needs: [test, security, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão da imagem
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: >
          docker build
          --build-arg APP_VERSION=${{ steps.meta.outputs.tag }}
          -t ${{ env.LOCAL_IMAGE }} .

      - name: Scan da imagem (Trivy) - relatório HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan da imagem (Trivy) - bloqueia CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Subir a stack com Docker Compose (API + Prometheus + Grafana)
        run: docker compose up -d --no-build

      - name: Smoke test da API no container
        run: deploy/scripts/smoke_test.sh http://localhost:8000

      - name: Verificar coleta de métricas e Grafana
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:9090/api/v1/targets | grep -q '"health":"up"'; then
              echo "Prometheus coletando métricas da API"; break
            fi
            [ "$i" -eq 20 ] && { echo "Prometheus não coletou a API"; exit 1; }
            sleep 5
          done
          curl -fs http://localhost:3000/api/health

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color --tail=50 && docker compose down

      # ---------------------------------------------------------------- CD
      - name: Credenciais AWS via OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publicar imagem no ECR
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          IMAGE="${{ vars.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "### Imagem publicada: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy em produção (CD)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # O ambiente "production" exige aprovação manual (Settings > Environments)
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RELEASE: s3://${{ vars.DEPLOY_BUCKET }}/releases/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Enviar artefatos de deploy para o S3
        run: aws s3 sync deploy/ "$RELEASE/" --delete

      - name: Executar deploy.sh na EC2 via AWS SSM
        run: |
          APP_DIR=/opt/devops-na-pratica
          PARAMS=$(jq -n --arg release "$RELEASE" --arg dir "$APP_DIR" --arg image "$IMAGE" --arg region "${{ vars.AWS_REGION }}" '{
            commands: [
              "set -e",
              "aws s3 sync \($release)/ \($dir)/ --delete --exclude \".state/*\" --region \($region)",
              "chmod +x \($dir)/scripts/*.sh",
              "\($dir)/scripts/deploy.sh \($image)"
            ]
          }')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $CMD_ID"

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "Status final: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Smoke test pela internet
        run: TENTATIVAS=10 deploy/scripts/smoke_test.sh "${{ vars.APP_URL }}"

      - name: Resumo do deploy
        run: |
          {
            echo "### Deploy concluído"
            echo "- Imagem: \`$IMAGE\`"
            echo "- URL: ${{ vars.APP_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"

  dast:
    name: DAST (OWASP ZAP)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Varredura dinâmica de segurança na aplicação publicada
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.APP_URL }}
          fail_action: false
          allow_issue_writing: false
          artifact_name: relatorio-zap
